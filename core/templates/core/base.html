<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestão de Projetos e Tarefas{% endblock %}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f4f4;
            color: #333;
        }

        nav {
            background: #243447;
            padding: 16px 24px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 1000px;
            margin: 25px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
        }

        button {
            padding: 8px 14px;
            cursor: pointer;
        }

        .mensagem {
            padding: 10px;
            margin-bottom: 12px;
            background: #e0f2e8;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'listar_projetos' %}">Projetos</a>
        <a href="{% url 'listar_tarefas' %}">Tarefas</a>
        <a href="{% url 'cadastrar_projeto' %}">Novo projeto</a>
        <a href="{% url 'cadastrar_tarefa' %}">Nova tarefa</a>
    </nav>

    <main>
        {% if messages %}
            {% for message in messages %}
                <div class="mensagem">{{ message }}</div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
