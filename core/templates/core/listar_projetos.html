<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Projetos</title>
</head>
<body>
    <h1>Lista de Projetos</h1>

    <a href="{% url 'cadastrar_projeto' %}">
        Cadastrar novo projeto
    </a>


    {% for projeto in projetos %}
        <div>
            <h2>{{ projeto }}</h2>

            <a href="{% url 'editar_projeto' projeto.pk %}">Editar</a>

            <a href="{% url 'excluir_projeto' projeto.pk %}">Excluir</a>
        </div>
    {% empty %}
        <p>Nenhum projeto cadastrado.</p>
    {% endfor %}

</body>
</html>
