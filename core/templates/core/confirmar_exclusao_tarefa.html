{% extends 'core/base.html' %}

{% block title %}Excluir Tarefa{% endblock %}

{% block content %}
<h1>Excluir tarefa</h1>

<p>Tem certeza de que deseja excluir "{{ tarefa.titulo }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Confirmar exclusão</button>
</form>

<a href="{% url 'listar_tarefas' %}">Cancelar</a>
{% endblock %}
